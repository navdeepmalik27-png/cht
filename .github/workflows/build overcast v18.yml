name: Build Overcast Mini v1.8 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate v1.8 Android source
        shell: bash
        run: |
          set -euo pipefail
          # Select the v1.8 ZIP, even if older versions remain in the repo.
          if [[ -f overcast-mini-v18-github-ready.zip ]]; then
            mkdir -p _overcast_v18
            unzip -q -o overcast-mini-v18-github-ready.zip -d _overcast_v18
            ROOT=_overcast_v18
          elif [[ -f build_min_apk.sh && -d app/src/main/res ]]; then
            ROOT=.
          elif [[ -f overcast-mini-widget/build_min_apk.sh && -d overcast-mini-widget/app/src/main/res ]]; then
            ROOT=overcast-mini-widget
          else
            echo '::error::Missing v1.8 source ZIP or extracted Android project'
            find . -maxdepth 3 -type f | head -80 || true
            exit 1
          fi
          [[ -f "$ROOT/build_min_apk.sh" ]] || { echo '::error::Missing build_min_apk.sh'; exit 1; }
          [[ -d "$ROOT/app/src/main/res" ]] || { echo '::error::Missing Android resources'; exit 1; }
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Building Overcast Mini from $ROOT"

      - name: Install Android SDK Platform 35 and Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$MANAGER" ]]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          [[ -x "$MANAGER" ]] || { echo '::error::Android sdkmanager unavailable on runner'; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$MANAGER" --licenses >/dev/null
          set -o pipefail
          "$MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
          test -x "$SDK/build-tools/35.0.0/d8"
          test -x "$SDK/build-tools/35.0.0/apksigner"

      - name: Compile and sign v1.8 APK
        shell: bash
        env:
          OVERCAST_KEYSTORE_B64: ${{ secrets.OVERCAST_KEYSTORE_B64 }}
          OVERCAST_KEYSTORE_PASS: ${{ secrets.OVERCAST_KEYSTORE_PASS }}
          OVERCAST_KEY_PASS: ${{ secrets.OVERCAST_KEY_PASS }}
          OVERCAST_KEY_ALIAS: ${{ secrets.OVERCAST_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash "$PROJECT_ROOT/build_min_apk.sh"
          test -s "$PROJECT_ROOT/build_min/overcast-mini-widget.apk"

      - name: Upload v1.8 installable APK
        uses: actions/upload-artifact@v4
        with:
          name: overcast-mini-v18-apk
          path: '**/build_min/overcast-mini-widget.apk'
          if-no-files-found: error
