name: Build Overcast Mini APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or extract Android source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f overcast-mini-news-v14.zip ]]; then
            mkdir -p unpacked-project
            unzip -q overcast-mini-news-v14.zip -d unpacked-project
            ROOT=unpacked-project
          elif [[ -f build_min_apk.sh && -d app/src/main/res ]]; then
            ROOT=.
          elif [[ -f overcast-mini-widget/build_min_apk.sh && -d overcast-mini-widget/app/src/main/res ]]; then
            ROOT=overcast-mini-widget
          else
            echo '::error::Upload overcast-mini-news-v14.zip to repository root, or commit the extracted source.'
            find . -maxdepth 4 -type f | head -100 || true
            exit 1
          fi
          [[ -f "$ROOT/build_min_apk.sh" && -d "$ROOT/app/src/main/res" ]] || {
            echo "::error::Missing build_min_apk.sh or app/src/main/res in $ROOT"
            exit 1
          }
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Using Android project: $ROOT"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$MANAGER" ]]; then
            MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          [[ -x "$MANAGER" ]] || { echo '::error::SDK manager not found'; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$MANAGER" --licenses >/dev/null
          set -o pipefail
          "$MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
          test -x "$SDK/build-tools/35.0.0/d8"

      - name: Build APK
        shell: bash
        env:
          OVERCAST_KEYSTORE_B64: ${{ secrets.OVERCAST_KEYSTORE_B64 }}
          OVERCAST_KEYSTORE_PASS: ${{ secrets.OVERCAST_KEYSTORE_PASS }}
          OVERCAST_KEY_PASS: ${{ secrets.OVERCAST_KEY_PASS }}
          OVERCAST_KEY_ALIAS: ${{ secrets.OVERCAST_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash "$PROJECT_ROOT/build_min_apk.sh"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overcast-mini-news-v14-apk
          path: '**/build_min/overcast-mini-widget.apk'
          if-no-files-found: error
